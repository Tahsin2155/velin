name: Release extension

# Push a tag like v1.0.0 (matching "version" in manifest.json) and this builds
# velin-extension.zip and attaches it to a new GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        env:
          TAG: ${{ github.ref_name }}
        run: python3 build_extension.py --expect-tag "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/velin-extension.zip --title "Velin $TAG" --generate-notes
